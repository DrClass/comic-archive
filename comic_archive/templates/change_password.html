{% extends "base.html" %}
{% block title %}Change password — Comic Archive{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if success %}<div class="card">{{ success }}</div>{% endif %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
  <div class="form-row"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
  <div class="form-row"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="10" autocomplete="new-password" required></div>
  <div class="form-row"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></div>
  <button type="submit">Change password</button>
</form>
{% endblock %}
