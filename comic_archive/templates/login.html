{% extends "base.html" %}
{% block title %}Login — Comic Archive{% endblock %}
{% block content %}
<h1>Login</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token', '') }}">
  <div class="form-row"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
  <div class="form-row"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button type="submit">Log in</button>
</form>
{% endblock %}
