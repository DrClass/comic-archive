[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-archive"
version = "0.1.0"
description = "Private comic archive importer and web library"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "argon2-cffi>=23.1", "itsdangerous>=2.1", "pillow>=10.0", "python-multipart>=0.0.9"]

[project.scripts]
comic-import = "comic_archive.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["comic_archive*"]
exclude = ["library*", "staging*", "tests*"]
